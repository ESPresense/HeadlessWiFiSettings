[platformio]
src_dir = .

[env:esp32c3]
; Same platform ESPresense pins; its arduino-esp32 fork still ships SPIFFS.
platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.07.00/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  https://github.com/ESPresense/ImprovWiFi.git
